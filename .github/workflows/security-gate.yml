name: Security Gate

on:
  pull_request:
    branches: [main]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ===========================================
      # Layer 1: .security-level の存在と妥当性
      # ===========================================
      - name: Validate .security-level
        id: level
        run: |
          if [ ! -f .security-level ]; then
            echo "ERROR: .security-level が存在しません。"
            echo "       Claude Code セッションで /triage を実施してください。"
            exit 1
          fi
          level=$(tr -d '[:space:]' < .security-level)
          if [ "$level" != "1" ] && [ "$level" != "3" ]; then
            echo "ERROR: .security-level は '1' または '3' のみ有効（現在: '$level'）"
            exit 1
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo ".security-level = $level"

      # ===========================================
      # Layer 3: L3 でエンジニア相談記録の検査
      # ===========================================
      - name: L3 — engineer consultation must exist with all 6 fields
        if: steps.level.outputs.level == '3'
        run: |
          f=docs/engineer-consultation.md
          if [ ! -f "$f" ]; then
            echo "ERROR: L3 プロジェクトには $f が必須。"
            echo "       Slack #ai-jigyobu-engineer-consult で相談 → テンプレ記入 → commit。"
            exit 1
          fi
          fail=0
          for field in "対象データ" "外部送信先" "必要権限" "想定事故" "許可範囲" "有効期限"; do
            if ! grep -qE "^## $field" "$f"; then
              echo "ERROR: $f に必須見出し '$field' が無い"
              fail=1
              continue
            fi
            # 見出し直下の内容が空（HTMLコメントしかない 等）でないか検査
            content=$(awk -v h="^## $field" '
              $0 ~ h {found=1; next}
              found && /^##/ {exit}
              found {print}
            ' "$f" | grep -vE '^[[:space:]]*(<!--.*-->|)[[:space:]]*$' || true)
            if [ -z "$content" ]; then
              echo "ERROR: $f の '$field' の中身が空"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "L3 必須 6 項目 OK"

      - name: L3 — engineer consultation expiry check
        if: steps.level.outputs.level == '3'
        run: |
          f=docs/engineer-consultation.md
          expiry=$(awk '/^## 有効期限/{found=1; next} found && /^##/{exit} found' "$f" \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          if [ -z "$expiry" ]; then
            echo "ERROR: $f に有効期限（YYYY-MM-DD）が記載されていない"
            exit 1
          fi
          today=$(date +%Y-%m-%d)
          if [ "$expiry" \< "$today" ]; then
            echo "ERROR: エンジニア相談の有効期限が切れています（$expiry < $today）。"
            echo "       再相談・再承認が必要。"
            exit 1
          fi
          echo "有効期限 OK: $expiry"

      # ===========================================
      # Layer 2: 差分検知で再トリアージ強制
      # ===========================================
      - name: Re-triage required when risky diff detected
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          risky=false
          # 環境変数 / 依存関係の変更
          if git diff --name-only "$base" "$head" | grep -qE '(^|/)(\.env(\..*)?|package\.json|pnpm-lock\.yaml|requirements\.txt|Pipfile|Gemfile)$'; then
            risky=true
            echo "INFO: 環境変数 / 依存関係の変更を検出"
          fi
          # 外部 API / 送信先パターンの追加
          if git diff "$base" "$head" 2>/dev/null | grep -E '^\+' | grep -qE 'twilio|stripe|sendgrid|webhook|new\s+OAuth|client_secret|chat:write|files:read|drive\.(readonly|file)|gmail\.|hr_|payroll'; then
            risky=true
            echo "INFO: 外部送信 / 高権限 API パターンの追加を検出"
          fi
          if [ "$risky" = "true" ]; then
            if [ ! -f docs/triage-record.md ]; then
              echo "ERROR: 危険な差分を検出したが docs/triage-record.md が無い。"
              echo "       /triage を実施してください。"
              exit 1
            fi
            # docs/triage-record.md が PR で更新されているか
            if ! git diff --name-only "$base" "$head" | grep -q '^docs/triage-record\.md$'; then
              echo "ERROR: 危険な差分（env / 依存 / 外部 API）を検出したが docs/triage-record.md が更新されていない。"
              echo "       /triage を再実施し、結果を docs/triage-record.md に反映してください。"
              exit 1
            fi
            echo "再トリアージ済み OK"
          fi

      # ===========================================
      # Layer 2: PII キーワード逆算（L1 申告時のみ）
      # ===========================================
      - name: PII keyword reverse detection (L1 only)
        if: steps.level.outputs.level == '1'
        run: |
          # 強検知（単語単独で出たら ERROR）
          strong_pattern='twilio|stripe|sendgrid|payroll|transcript|recording|顧客|お客様|個人情報|マイナンバー|保険証'
          # 文脈付き検知（誤検知少）
          context_pattern='customer\.email|user\.email|contact\.phone|customer\.phone|email_address|phone_number|home_address|employee_(salary|evaluation|health)|hr_(?:data|info)'

          hits=$(grep -rIn --include='*.js' --include='*.ts' --include='*.jsx' --include='*.tsx' \
            --include='*.py' --include='*.gs' --include='*.rb' --include='*.java' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
            --exclude-dir=test --exclude-dir=tests --exclude-dir=__tests__ \
            --exclude-dir=fixtures --exclude-dir=examples \
            -E "($strong_pattern)|($context_pattern)" . 2>/dev/null \
            | grep -vE '\.env\.example' \
            | head -30 || true)

          if [ -n "$hits" ]; then
            echo "ERROR: .security-level=1 だが PII / 機密関連キーワードを検出"
            echo ""
            echo "$hits"
            echo ""
            echo "対処:"
            echo "  1. 本当に PII / 機密が混入したなら → /triage で L3 に再判定 → エンジニア相談"
            echo "  2. 誤検知（テストフィクスチャ等）なら → 該当箇所を test/ / fixtures/ 配下に移すか、PR コメントで理由を明記"
            exit 1
          fi
          echo "PII キーワード逆算検知 OK"
